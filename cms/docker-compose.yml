services:
  postgres:
    image: postgres:16-alpine
    container_name: mhd_cms_v2_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Read from .env / .env.production — never hardcode credentials here
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: mhd_payload
    ports:
      # Bind to loopback only: the DB must not be reachable from the network
      - "127.0.0.1:5434:5432"
    volumes:
      - mhd_postgres_data:/var/lib/postgresql/data

volumes:
  mhd_postgres_data:
